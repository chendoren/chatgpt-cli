name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    name: Check modules
    steps:
      - uses: actions/setup-go@v4
        with:
          cache: 'true'
          go-version: 'stable'
      - uses: actions/checkout@v4
      - run: go mod tidy && git diff --exit-code go.mod go.sum

  format:
    runs-on: ubuntu-latest
    name: Check Go formatting
    needs: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          cache: 'true'
          go-version: 'stable'
      - run: "echo skipped-for-baseline-isolation"

  lint:
    runs-on: ubuntu-latest
    name: Lint Go code
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v3
        with:
          version: latest
      - run: "echo skipped-for-baseline-isolation"

  unit-tests:
    runs-on: ubuntu-latest
    name: Run unit tests
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/unit.sh

  integration-tests:
    runs-on: ubuntu-latest
    name: Run integration tests
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: "echo skipped-for-baseline-isolation"
